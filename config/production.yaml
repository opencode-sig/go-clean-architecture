server:
  port: "8080"
  read_header_timeout: 5
  read_timeout: 30
  write_timeout: 30
  idle_timeout: 120
mysql:
  host: "127.0.0.1"
  port: 3306
  user: "zhisuo"
  password: "zhisuo123!"
  name: "zhisuo"
  charset: "utf8mb4"
  parse_time: "True"
  loc: "Asia/Shanghai"
  max_open_conns: 100
  max_idle_conns: 20
  conn_max_lifetime: 300
cache:
  enabled: true
  type: "redis"
  ttl: 300
redis:
  mode: "cluster"
  addrs:
    - "redis-1:6379"
    - "redis-2:6379"
    - "redis-3:6379"
  username: ""
  password: ""
  pool_size: 10
  min_idle_conns: 2
  conn_max_idle_time: 300
rate_limit:
  rps: 50
  burst: 100
  # trust_proxy: true  # only enable behind a proxy that overwrites X-Forwarded-For
idempotency:
  ttl: 86400          # seconds a completed Idempotency-Key is retained
  cleanup_interval: 3600  # seconds between expiry sweeps
# auth:
#   enabled: true      # require JWT on /api/v1 (secret must be set)
#   secret: ""         # HMAC signing secret — use env/config secret, never commit
#   issuer: "zhisuo-server"
#   expires: 86400
#   dev_token_endpoint: false  # dev-only /api/v1/auth/token (no credential check)
pagination:
  default_page_size: 20
  max_page_size: 100
log:
  level: "warn"
  file: "logs/app.log"
  max_size: 500
  max_age: 90
  max_backups: 30