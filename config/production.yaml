server:
  port: "8080"
  read_header_timeout: 5
  read_timeout: 30
  write_timeout: 30
  idle_timeout: 120
mysql:
  host: "127.0.0.1"
  port: 3306
  user: "zhisuo"
  password: "zhisuo123!"
  name: "zhisuo"
  charset: "utf8mb4"
  parse_time: "True"
  loc: "Asia/Shanghai"
  max_open_conns: 100
  max_idle_conns: 20
  conn_max_lifetime: 300
cache:
  enabled: true
  type: "redis"
  ttl: 300
redis:
  mode: "cluster"
  addrs:
    - "redis-1:6379"
    - "redis-2:6379"
    - "redis-3:6379"
  username: ""
  password: ""
  pool_size: 10
  min_idle_conns: 2
  conn_max_idle_time: 300
rate_limit:
  rps: 50
  burst: 100
pagination:
  default_page_size: 20
  max_page_size: 100
log:
  level: "warn"
  file: "logs/app.log"
  max_size: 500
  max_age: 90
  max_backups: 30